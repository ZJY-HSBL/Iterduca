name: Installer CI

on:
  push:
    branches:
      - main
      - "develop/**"
    paths:
      - "pyproject.toml"
      - "scripts/installer.iss"
      - "scripts/write_version_info.py"
      - ".github/workflows/release.yml"
      - ".github/workflows/installer-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "scripts/installer.iss"
      - "scripts/write_version_info.py"
      - ".github/workflows/release.yml"
      - ".github/workflows/installer-ci.yml"
  workflow_dispatch:

jobs:
  windows-installer:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pyinstaller

      - name: Generate version metadata
        run: python scripts/write_version_info.py build/version_info.txt

      - name: Build executable
        run: >
          pyinstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name Iterduca
          --version-file build/version_info.txt
          --paths src
          src/iterduca/__main__.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          iscc "/DMyAppVersion=$version" "scripts/installer.iss"

      - name: Verify artifacts
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $setup = "dist/Iterduca-v$version-windows-x64-setup.exe"
          if (-not (Test-Path "dist/Iterduca.exe")) { throw "Iterduca.exe was not generated" }
          if (-not (Test-Path $setup)) { throw "Installer was not generated: $setup" }
