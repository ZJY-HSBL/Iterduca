name: UI Screenshots

on:
  push:
    branches:
      - "develop/**"
    paths:
      - "src/iterduca/ui/**"
      - "scripts/capture_screenshots.py"
      - ".github/workflows/ui-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application
        run: python -m pip install -e .
      - name: Capture real Qt pages
        run: python scripts/capture_screenshots.py
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: iterduca-ui-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Commit refreshed screenshots
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Screenshots are unchanged."
            exit 0
          }
          git commit -m "docs: refresh UI screenshots [skip ci]"
          git pull --rebase origin "$env:GITHUB_REF_NAME"
          git push origin "HEAD:$env:GITHUB_REF_NAME"
