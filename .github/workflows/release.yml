name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and packager
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pyinstaller

      - name: Verify release version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $expected = "v$version"
          if ($env:RELEASE_TAG -ne $expected) {
            throw "Release tag $env:RELEASE_TAG does not match project version $expected"
          }

      - name: Generate Windows version metadata
        run: python scripts/write_version_info.py build/version_info.txt

      - name: Build Windows executable
        run: >
          pyinstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name Iterduca
          --version-file build/version_info.txt
          --paths src
          src/iterduca/__main__.py

      - name: Package Windows release
        shell: pwsh
        run: |
          $exe = "Iterduca-$env:RELEASE_TAG-windows-x64.exe"
          $archive = "Iterduca-$env:RELEASE_TAG-windows-x64.zip"
          $portable = "build/portable"

          New-Item -ItemType Directory -Path $portable -Force | Out-Null
          Copy-Item "dist/Iterduca.exe" $exe
          Copy-Item $exe "$portable/Iterduca.exe"
          Copy-Item "LICENSE" "$portable/LICENSE"
          Copy-Item "README.md" "$portable/README.md"
          Copy-Item "README.zh-CN.md" "$portable/README.zh-CN.md"
          Compress-Archive -Path "$portable/*" -DestinationPath $archive -Force

          $exeHash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$exeHash  $exe" | Set-Content -Path "SHA256SUMS.txt"
          "$zipHash  $archive" | Add-Content -Path "SHA256SUMS.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Iterduca ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          body: |
            Windows-first desktop proxy and network routing client powered by Mihomo.

            Mihomo is not bundled with Iterduca. Select your Mihomo executable in Settings after launch.
          files: |
            Iterduca-${{ env.RELEASE_TAG }}-windows-x64.exe
            Iterduca-${{ env.RELEASE_TAG }}-windows-x64.zip
            SHA256SUMS.txt
