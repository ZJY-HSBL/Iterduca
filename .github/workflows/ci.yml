name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: GUI import smoke test
        run: python -c "import iterduca.app"
      - name: Windows version metadata smoke test
        run: python scripts/write_version_info.py build/version_info.txt
      - name: Test
        run: python -m pytest
