[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "iterduca"
version = "1.4.0"
description = "Modern desktop proxy and network routing client powered by Mihomo"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "ZJY-HSBL" }]
dependencies = [
  "PyQt6>=6.7,<7",
  "httpx>=0.27,<1",
  "PyYAML>=6.0,<7",
  "websocket-client>=1.8,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
iterduca = "iterduca.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/iterduca"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
